<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css"
        integrity="sha512-F/yRpRY8sctKzP7exU5PLGejwg/QtjDX6CIy/41nApe7JqdZgCcCzJTNq9Rcp/XwbeeTGillGevBakruY15pxA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <div class="toolbar" >
            <div class="toolbar">
                <input type="text" placeholder="File Name" value="File name" id="fileName"/>
                <select>
                    <option value="" selected hidden>File</option>
                    <option value="">new File</option>
                    <option value="">save as text</option>
                    <option value="">save as pdf</option>
                </select>
                <select>
                    <option value="" selected hidden>Format</option>
                    <option value="">H1</option>
                    <option value="">H2</option>
                    <option value="">H3</option>
                    <option value="">H4</option>
                    <option value="">H5</option>
                    <option value="">H6</option>
                    <option value="">Paragraph</option>
                </select>
                <select>
                    <option value="" selected hidden>Font Size</option>
                    <option value="">Extra Small</option>
                    <option value="">Small</option>
                    <option value="">Medium</option>
                    <option value="">Large</option>
                    <option value="">Extra Large</option>
                    <option value="">Big</option>                 
            </div>
        </div>
        <div id="content" contenteditable="true" spellcheck="true"></div>
    </div>
    
</body>
</html>
